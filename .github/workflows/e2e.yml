name: Cypress E2E + Allure Report

on:
  push:
    branches: [ main ]
  pull_request:

jobs:

  cypress-run:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do projeto
        uses: actions/checkout@v4

      - name: 🟢 Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 Instalar dependências
        run: npm ci

      - name: 🧪 Rodar testes Cypress
        run: npx cypress run

      - name: 📊 Gerar Allure results como artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results

  generate-report:
    needs: cypress-run
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📥 Baixar allure-results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: ☕ Instalar Java (necessário para Allure)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 📊 Gerar Allure Report
        run: |
          npm install -g allure-commandline
          allure generate allure-results --clean -o allure-report

      - name: 📦 Upload do relatório
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: 🚀 Publicar no GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
